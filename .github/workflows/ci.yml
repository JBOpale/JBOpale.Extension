name: Tests

on:
  push:
    branches: [main]
  # Plus de déclencheur pull_request : les tests des PR sont lancés par pr-tests.yml
  # (check requis « JBOpale.Extensions - Tests PR »), pour éviter les doubles runs.

jobs:
  test:
    name: JBOpale.Extensions - Tests (push main)
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]

    # Runner Windows : bash pointe sur un WSL vide, toutes les étapes sont en PowerShell.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les SDK .NET 8 et 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Tests (net48, net8.0 et net10.0)
        run: dotnet test JBOpale.Extensions.sln --configuration Release
